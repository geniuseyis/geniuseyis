name: snake

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#a9680f&color_dots=#ebedf0,#f3dcae,#e4b866,#c48d36,#8f5a0c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f0a945&color_dots=#1d1f26,#52401f,#8c6828,#c48d36,#f0a945

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
